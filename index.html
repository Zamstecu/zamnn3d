<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itsmee | Portofolio Kreatif</title>
    <style>
        /* KODE CSS OFFLINE - TIDAK BUTUH INTERNET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        /* EFEK CAHAYA UNGU DI BELAKANG */
        .ambient-glow {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: rgba(147, 51, 234, 0.1);
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 10;
            max-width: 650px;
            margin: 0 auto;
            padding: 60px 24px;
        }
        header {
            margin-bottom: 48px;
        }
        header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: #ffffff;
        }
        /* WRAPPER GAMBAR HERO */
        .image-card {
            position: relative;
            background: rgba(31, 40, 51, 0.4);
            border: 1px solid rgba(147, 51, 234, 0.2);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
        }
        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.9;
            transition: transform 0.5s;
        }
        .image-card:hover img {
            transform: scale(1.01);
        }
        .clean-code-badge {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(147, 51, 234, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #d8b4fe;
            font-family: monospace;
        }
        /* TEXT CONTENT */
        .content-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .welcome-badge {
            align-self: flex-start;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #c084fc;
            background: rgba(147, 51, 234, 0.1);
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid rgba(147, 51, 234, 0.2);
        }
        .main-title {
            font-size: 40px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        .gradient-text {
            background: linear-gradient(to right, #a78bfa, #c084fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 18px;
            font-weight: 700;
            color: #c084fc;
            font-family: monospace;
        }
        .cursor {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        .description {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
        }
        .highlight {
            color: #ffffff;
            font-weight: 600;
        }
        /* STATISTIK SECTION */
        .stats-section {
            display: grid;
            grid-template-cols: 1fr 1fr;
            gap: 32px;
            border-top: 1px solid rgba(147, 51, 234, 0.1);
            margin-top: 48px;
            padding-top: 32px;
        }
        .stat-box h3 {
            font-size: 30px;
            font-weight: 900;
            color: #ffffff;
        }
        .stat-box p {
            font-size: 12px;
            color: rgba(192, 132, 252, 0.7);
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <main class="container">
        
        <header>
            <h1>Zamnn3d.</h1>
        </header>

        <section class="image-card">
            <!-- CATATAN: Pastikan gambar art-hero.png ada di dalam folder images/ -->
            <img src="https://github.com/Zamstecu/zamnn3d/blob/main/ojos%20de%20Hinata.jpg" alt="Seni Portofolio">
            <div class="clean-code-badge">&lt;/&gt; Clean code</div>
        </section>

        <div class="content-section">
            <span class="welcome-badge">Welcome</span>

            <h2 class="main-title">
                Hello Everyone I'm <br>
                <span class="gradient-text">Zamnn3d</span>
            </h2>

            <p class="subtitle">I'm a Full Stack<span class="cursor">|</span></p>

            <p class="description">
                I am a web developer focused on building modern, responsive, and efficient websites. With a growing expertise in <span class="highlight">HTML, CSS, and JavaScript</span>.
            </p>
        </div>

        <section class="stats-section">
            <div class="stat-box">
                <h3>4+</h3>
                <p>Project Completed</p>
            </div>
            <div class="stat-box">
                <h3>1+</h3>
                <p>Months Experience</p>
            </div>
        </section>

    </main>

</body>
</html>
