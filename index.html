<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itsmee | Si anak mama</title>
    <style>
        /* KODE CSS OFFLINE - TIDAK BUTUH INTERNET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        /* EFEK CAHAYA UNGU DI BELAKANG */
        .ambient-glow {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: rgba(147, 51, 234, 0.15);
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 10;
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 24px;
        }
        header {
            margin-bottom: 40px;
        }
        header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: #ffffff;
        }
        /* WRAPPER GAMBAR / VIDEO HERO */
        .image-card {
            position: relative;
            background: rgba(31, 40, 51, 0.4);
            border: 1px solid rgba(147, 51, 234, 0.25);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            margin-bottom: 40px;
        }
        .image-card img,
        .image-card video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            opacity: 0.9;
            transition: transform 0.5s;
        }
        .image-card:hover img,
        .image-card:hover video {
            transform: scale(1.02);
        }
        .clean-code-badge {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(147, 51, 234, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #d8b4fe;
            font-family: monospace;
        }
        /* TEXT CONTENT */
        .content-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .welcome-badge {
            align-self: flex-start;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #c084fc;
            background: rgba(147, 51, 234, 0.12);
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid rgba(147, 51, 234, 0.25);
        }
        .main-title {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        .gradient-text {
            background: linear-gradient(to right, #a78bfa, #c084fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 18px;
            font-weight: 700;
            color: #c084fc;
            font-family: monospace;
        }
        .cursor {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        .description {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
        }
        /* TECH STACK BADGES */
        .tech-stack {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .tech-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        /* BUTTONS */
        .cta-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }
        .btn-primary {
            background: #9333ea;
            color: #ffffff;
            border: 1px solid #a855f7;
            box-shadow: 0 4px 14px rgba(147, 51, 234, 0.4);
        }
        .btn-primary:hover {
            background: #7e22ce;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #d8b4fe;
            border: 1px solid rgba(147, 51, 234, 0.3);
        }
        .btn-secondary:hover {
            background: rgba(147, 51, 234, 0.15);
            transform: translateY(-2px);
        }

        /* STATISTIK SECTION (4 BOXES GRID) */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 16px;
            border-top: 1px solid rgba(147, 51, 234, 0.15);
            margin-top: 40px;
            padding-top: 32px;
        }
        .stat-box {
            background: rgba(31, 40, 51, 0.3);
            border: 1px solid rgba(147, 51, 234, 0.2);
            padding: 16px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            transition: transform 0.3s, border-color 0.3s;
        }
        .stat-box:hover {
            transform: translateY(-3px);
            border-color: rgba(192, 132, 252, 0.5);
        }
        .stat-box h3 {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
        }
        .stat-box p {
            font-size: 11px;
            color: rgba(192, 132, 252, 0.8);
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }
    </style>
</head>
