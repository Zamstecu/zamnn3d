<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZamnnX3d</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;

            /* BACKGROUND SHINOBU */
            background:
                linear-gradient(
                    rgba(8, 4, 15, 0.45),
                    rgba(8, 4, 15, 0.75)
                ),
                url("https://raw.githubusercontent.com/Zamstecu/zamnn3d/07fcf25a5d97f1e00bd2cb1b4de0c0888531f2c8/shinobu.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* BACKGROUND GLOW */
        .ambient-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(147, 51, 234, 0.15);
            filter: blur(120px);
            pointer-events: none;
            z-index: -1;
        }

        /* MAIN CONTAINER */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px 60px;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 32px;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }

        /* VIDEO CARD */
        .image-card {
            width: 100%;
            max-width: 950px;
            margin: 0 auto;

            border-radius: 22px;
            overflow: hidden;

            border: 1px solid rgba(168, 85, 247, 0.4);

            background: rgba(0, 0, 0, 0.25);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(147, 51, 234, 0.2);

            backdrop-filter: blur(5px);
        }

        .image-card video {
            display: block;
            width: 100%;
            height: 520px;
            object-fit: cover;
        }

        /* CONTENT */
        .content-section {
            width: 100%;
            max-width: 850px;
            margin: 40px auto 0;
            text-align: center;
        }

        /* WELCOME BADGE */
        .welcome-badge {
            display: inline-block;

            padding: 7px 16px;

            border-radius: 20px;

            background: rgba(147, 51, 234, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);

            color: #d8b4fe;

            font-size: 13px;
            font-weight: 600;

            box-shadow:
                0 0 20px rgba(147, 51, 234, 0.1);
        }

        /* TITLE */
        .main-title {
            margin-top: 18px;

            font-size: 44px;
            line-height: 1.15;
            font-weight: 900;

            color: white;
        }

        .gradient-text {
            background: linear-gradient(
                90deg,
                #c084fc,
                #9333ea,
                #e879f9
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* SUBTITLE */
        .subtitle {
            margin-top: 15px;

            color: #d8b4fe;
            font-size: 18px;
        }

        .cursor {
            color: #a855f7;

            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* DESCRIPTION */
        .description {
            max-width: 650px;
            margin: 20px auto;

            color: rgba(255, 255, 255, 0.78);

            font-size: 15px;
            line-height: 1.7;
        }

        /* TECH STACK */
        .tech-stack {
            display: flex;
            justify-content: center;
            align-items: center;

            flex-wrap: wrap;
            gap: 10px;

            margin-top: 20px;
        }

        .tech-badge {
            padding: 8px 14px;

            border-radius: 8px;

            background: rgba(147, 51, 234, 0.13);

            border: 1px solid rgba(168, 85, 247, 0.3);

            color: #d8b4fe;

            font-size: 13px;
            font-weight: 600;

            backdrop-filter: blur(5px);

            transition: 0.3s;
        }

        .tech-badge:hover {
            transform: translateY(-3px);

            background: rgba(147, 51, 234, 0.25);

            border-color: rgba(192, 132, 252, 0.6);
        }

        /* BUTTONS */
        .cta-buttons {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 12px;

            margin-top: 25px;
        }

        .btn {
            padding: 11px 22px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

            transition: all 0.3s;

            cursor: pointer;
        }

        .btn-primary {
            background: #9333ea;

            color: white;

            border: 1px solid #a855f7;

            box-shadow:
                0 4px 14px rgba(147, 51, 234, 0.4);
        }

        .btn-primary:hover {
            background: #7e22ce;

            transform: translateY(-3px);

            box-shadow:
                0 8px 25px rgba(147, 51, 234, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);

            color: #d8b4fe;

            border: 1px solid rgba(147, 51, 234, 0.4);

            backdrop-filter: blur(5px);
        }

        .btn-secondary:hover {
            background: rgba(147, 51, 234, 0.2);

            transform: translateY(-3px);
        }

        /* STATISTICS */
        .stats-section {
            width: 100%;
            max-width: 850px;

            margin: 50px auto 0;

            padding-top: 30px;

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 16px;

            border-top:
                1px solid rgba(147, 51, 234, 0.2);
        }

        .stat-box {
            padding: 18px;

            border-radius: 12px;

            background:
                rgba(31, 40, 51, 0.4);

            border:
                1px solid rgba(147, 51, 234, 0.25);

            backdrop-filter: blur(8px);

            text-align: center;

            transition:
                transform 0.3s,
                border-color 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-4px);

            border-color:
                rgba(192, 132, 252, 0.6);
        }

        .stat-box h3 {
            font-size: 28px;
            font-weight: 900;

            color: white;
        }

        .stat-box p {
            margin-top: 5px;

            font-size: 11px;

            color:
                rgba(192, 132, 252, 0.8);

            font-family: monospace;

            text-transform: uppercase;

            letter-spacing: 0.05em;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            .container {
                padding: 25px 15px 50px;
            }

            header h1 {
                font-size: 26px;
            }

            .image-card {
                border-radius: 16px;
            }

            .image-card video {
                height: 350px;
            }

            .main-title {
                font-size: 32px;
            }

            .subtitle {
                font-size: 16px;
            }

            .description {
                font-size: 14px;
            }

            .stats-section {
                grid-template-columns: repeat(2, 1fr);
            }

            .cta-buttons {
                flex-direction: column;
            }

            .btn {
                width: 220px;
                text-align: center;
            }
        }

        /* SMALL PHONE */
        @media (max-width: 400px) {

            .image-card video {
                height: 300px;
            }

            .main-title {
                font-size: 28px;
            }

            .stats-section {
                gap: 10px;
            }

            .stat-box {
                padding: 14px 8px;
            }

            .stat-box h3 {
                font-size: 23px;
            }
        }
    </style>
</head>
